name: Sync Data
on:
  repository_dispatch:
    types: [sync-data]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
    steps:
      - name: Update data file
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/meichaoxiali-eng/nursing-schedule.git repo
          cd repo
          echo '${{ github.event.client_payload.data }}' > data.json
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data.json
          git commit -m "Update schedule data" || echo "No changes"
          git push
