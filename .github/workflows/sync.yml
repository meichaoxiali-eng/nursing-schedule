name: Sync Data
on:
  repository_dispatch:
    types: [sync-data]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.SYNC_TOKEN }}
      - name: Update data
        run: |
          cat << 'DATAEOF' > data.json
          ${{ github.event.client_payload.data }}
          DATAEOF
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data.json
          git commit -m "Update schedule data" || echo "No changes"
          git push
