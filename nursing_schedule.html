function exportExcel(){
  exportExcelByType('nurse');
  setTimeout(()=>exportExcelByType('care'),1200);
}

async function exportExcelByType(staffType){
  if(typeof JSZip==='undefined'){showFlash('Excelライブラリ読み込み中...少し待って再試行してください','wb');return;}
  // 対象月を列挙（sch:YYYY-MM）古い順
  const monthKeys=Object.keys(S.schedules).filter(k=>/^sch:\d{4}-\d{2}$/.test(k)).sort();
  if(!monthKeys.length){showFlash('勤務表がありません','ab');return;}

  const typeName=staffType==='nurse'?'看護':'介護';
  const orgName=staffType==='nurse'?'訪問看護はる':'訪問介護はる';
  const svcName=staffType==='nurse'?'訪問看護（訪問看護ステーション）':'訪問介護';
  // 役所の正式ファイルをテンプレートに使用（看護／介護で別ファイル）
  const EXCEL_TEMPLATE_B64=staffType==='nurse'?EXCEL_TPL_NS_B64:EXCEL_TPL_KG_B64;
  // 看護ファイル＝看護系（バイト除く）、介護ファイル＝介護系すべて（種別定義のグループから自動）
  const FILE_TYPES=staffType==='nurse'?NURSE_FILE_TYPES:CARE_TYPES;
  // 公式様式の職種名・資格名は種別定義(job/lic)から取得（新種別も自動対応）
  const JOB_NAME=t=>jobNameOf(t);
  const LIC=t=>licNameOf(t);
  const shiftHrs={'日勤':8.0,'A勤':4.0,'P勤':4.0,'研修':8.0,'夜勤':8.0,'夜勤明け':8.0,'休み':0,'有給':0,'空白':0};
  const dayHoursOf=s=>{const v=parseFloat(s&&s.dayHours);return (isFinite(v)&&v>0)?v:8.0;};
  const hoursFor=(s,sh)=>{
    if(isCaseShift(sh)) return caseHours(s,sh);
    if(sh==='日勤'||sh==='バースデー'||sh==='リフレッシュ') return dayHoursOf(s);
    return shiftHrs[sh]||0;
  };
  // 日/夜の記号マップ（職員向けシート用）
  const shiftSym={'日勤':'日','A勤':'日','P勤':'日','研修':'研','夜勤':'夜','夜勤明け':'明','休み':'休','有給':'休','バースデー':'日','リフレッシュ':'日','空白':''};
  let overflow=false;

  // ===== XMLヘルパ（セル値のみ差し替え＝テンプレの書式を1バイトも壊さない） =====
  const xmlEsc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const colLetter=n=>{let s='';while(n>0){const r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26);}return s;};
  // セル置換（テンプレは全セル存在前提）。kind:'n'数値 / 's'文字列 / 'blank'空。書式(s="N")は保持
  function setCell(xml,ref,kind,val){
    const re=new RegExp('<c r="'+ref+'"([^>]*?)(/>|>(?:(?!</c>)[\\s\\S])*</c>)');
    const m=xml.match(re);
    if(!m)return xml;
    const sM=m[1].match(/\ss="(\d+)"/);
    const s=sM?' s="'+sM[1]+'"':'';
    let cell;
    if(kind==='blank')cell='<c r="'+ref+'"'+s+'/>';
    else if(kind==='n')cell='<c r="'+ref+'"'+s+'><v>'+val+'</v></c>';
    else cell='<c r="'+ref+'"'+s+' t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(val)+'</t></is></c>';
    return xml.replace(re,cell);
  }
  // 数式セルのキャッシュ値だけ差し替え（数式は保持）＝西暦など全ビューアで即正しく表示
  function setFormulaCache(xml,ref,val){
    const re=new RegExp('(<c r="'+ref+'"[^>]*><f>(?:(?!</c>)[\\s\\S])*?</f>)<v>[^<]*</v>');
    return xml.replace(re,'$1<v>'+val+'</v>');
  }

  // テンプレ読込（Base64→Uint8Array→JSZip）
  const binStr=atob(EXCEL_TEMPLATE_B64);
  const u8=new Uint8Array(binStr.length);
  for(let i=0;i<binStr.length;i++)u8[i]=binStr.charCodeAt(i);
  const zip=await JSZip.loadAsync(u8);
  let wbxml=await zip.file('xl/workbook.xml').async('string');
  let relsxml=await zip.file('xl/_rels/workbook.xml.rels').async('string');
  let ctxml=await zip.file('[Content_Types].xml').async('string');

  // フリガナ（ルビ）除去：公式様式は漢字のみ。共有文字列の読み仮名(rPh)とphoneticPrを削除
  // ＝Excelが漢字の上にカタカナふりがなを表示しないようにする（本文の<t>はそのまま保持）
  const ssFile=zip.file('xl/sharedStrings.xml');
  if(ssFile){
    let ssxml=await ssFile.async('string');
    ssxml=ssxml.replace(/<rPh\b[^>]*>[\s\S]*?<\/rPh>/g,'').replace(/<phoneticPr\b[^>]*\/>/g,'');
    zip.file('xl/sharedStrings.xml',ssxml);
  }
  // シート側のphoneticPr（既定ふりがなフォント指定）も除去＝Excelでの自動ふりがな再表示を防止
  const stripPhonetic=xml=>xml.replace(/<phoneticPr\b[^>]*\/>/g,'');

  // シート名→rId→ファイル
  const nameToRid={}; [...wbxml.matchAll(/<sheet name="([^"]*)"[^>]*r:id="(rId\d+)"[^>]*\/>/g)].forEach(m=>nameToRid[m[1]]=m[2]);
  const ridToFile={}; [...relsxml.matchAll(/<Relationship Id="(rId\d+)"[^>]*Target="(worksheets\/sheet\d+\.xml)"[^>]*\/>/g)].forEach(m=>ridToFile[m[1]]=m[2]);
  const fileOf=name=>ridToFile[nameToRid[name]];

  // 様式マスター（１枚版＝勤務形態一覧表）のXMLを確保
  const hoursMasterName=Object.keys(nameToRid).find(n=>n.indexOf('１枚版')>=0&&n.indexOf('100')<0);
  if(!hoursMasterName||!fileOf(hoursMasterName)){showFlash('様式テンプレートが見つかりません','ab');return;}
  const hoursMasterFile=fileOf(hoursMasterName);
  // 月シート用マスター：公式（１枚版）を丸ごと複製（職種・資格のプルダウン＝データ検証も保持）
  // 印刷設定のr:idだけ除去（複製シートには_relsを別途付与するので実際は保持→後述でコピー）
  const hoursMaster=stripPhonetic(await zip.file('xl/'+hoursMasterFile).async('string'));
  // マスターの_rels（印刷設定）内容を保持し、複製シートにも同じ_relsを付与する
  const masterRelsPath='xl/worksheets/_rels/'+hoursMasterFile.split('/').pop()+'.rels';
  const masterRels=zip.file(masterRelsPath)?await zip.file(masterRelsPath).async('string'):null;

  // 公式ファイルの全シートはそのまま残す（まんま移植）。各シートのふりがな指定だけ除去
  for(const nm of Object.keys(nameToRid)){
    const file=ridToFile[nameToRid[nm]];
    if(file){const kf=zip.file('xl/'+file);if(kf)zip.file('xl/'+file,stripPhonetic(await kf.async('string')));}
  }

  // 1枚版（時間数）用：管理者は「管理者」と職種の2行に分割、各日の時間を半分ずつ
  function buildHoursRows(schData,days){
    const staffs=S.staffList.filter(s=>FILE_TYPES.includes(s.type));
    const rows=[];
    staffs.forEach(s=>{
      const dayH={};
      for(let d=1;d<=days;d++){const sh=(schData[s.id]||{})[d]||'';dayH[d]=hoursFor(s,sh);}
      const isMgr=s.isKanri===true||/^kanri/.test(s.id||'');
      if(isMgr){
        const h1={},h2={};
        for(let d=1;d<=days;d++){const h=dayH[d]||0;const aa=h>0?Math.round(h/2*10)/10:0;h1[d]=aa;h2[d]=h>0?(Math.round(h*10)/10-aa):0;}
        rows.push({job:'管理者',emp:s.empType||'B',lic:'－',name:s.name,hours:h1});
        rows.push({job:JOB_NAME(s.type)||'看護職員',emp:s.empType||'B',lic:LIC(s.type)||'',name:s.name,hours:h2});
      }else{
        rows.push({job:JOB_NAME(s.type)||'看護職員',emp:s.empType||'A',lic:LIC(s.type)||'',name:s.name,hours:dayH});
      }
    });
    return rows;
  }

  // 職種名＝資格リストの名前定義名（管理者/看護職員/理学療法士…/訪問介護員/サービス提供責任者）
  const NAMED_JOBS=new Set(['管理者','看護職員','理学療法士','作業療法士','言語聴覚士','訪問介護員','サービス提供責任者']);
  // 資格ドロップダウンを各行の職種に直結し直す（公式はINDIRECT(C13)だがExcel環境によっては
  // INDIRECTが機能せず空になるため、職種と同じ「直接の名前定義参照」に置換＝確実に表示される）
  function rebuildLicValidation(xml,rows){
    const n=Math.min(rows.length,18);
    let dv='';
    for(let i=0;i<n;i++){const r=13+i;const job=rows[i].job;
      const f1=NAMED_JOBS.has(job)?job:('INDIRECT(C'+r+')');
      dv+='<dataValidation type="list" allowBlank="1" showInputMessage="1" sqref="G'+r+':K'+r+'"><formula1>'+f1+'</formula1></dataValidation>';
    }
    const firstBlank=13+n; // 空き行は従来どおりINDIRECTで職種連動（手動追加用）
    if(firstBlank<=30) dv+='<dataValidation type="list" errorStyle="warning" allowBlank="1" showInputMessage="1" error="リストにない場合のみ、入力してください。" sqref="G'+firstBlank+':K30"><formula1>INDIRECT(C'+firstBlank+')</formula1></dataValidation>';
    const replaced=xml.replace(/<dataValidation\b[^>]*sqref="G13:K30"[^>]*>\s*<formula1>INDIRECT\(C13\)<\/formula1>\s*<\/dataValidation>/,dv);
    // dataValidations の count を実数に更新（Excel修復防止）
    return replaced.replace(/<dataValidations count="\d+"/,'<dataValidations count="'+(replaced.match(/<formula1>/g)||[]).length+'"');
  }

  // 1枚版（勤務形態一覧表・時間数・常勤換算）XMLを生成
  function fillHours(xml,schData,days,y,m){
    xml=setCell(xml,'U2','n',y-2018); xml=setCell(xml,'AB2','n',m+1);
    xml=setFormulaCache(xml,'X2',y); // 西暦（=YEAR(DATE(2018+U2,1,1))）のキャッシュ更新
    xml=setCell(xml,'AM1','s',svcName); // サービス種別（介護は「訪問介護」）
    xml=setCell(xml,'AM2','s',orgName);
    // 13-30行をクリア（職種C/雇用E/資格G/氏名L＋各日列）
    for(let r=13;r<=30;r++){['C','E','G','L'].forEach(cl=>xml=setCell(xml,cl+r,'blank'));for(let d=1;d<=31;d++)xml=setCell(xml,colLetter(15+d)+r,'blank');}
    const rows=buildHoursRows(schData,days);
    rows.forEach((rw,i)=>{const r=13+i;if(r>30){overflow=true;return;}
      xml=setCell(xml,'C'+r,'s',rw.job);xml=setCell(xml,'E'+r,'s',rw.emp);xml=setCell(xml,'G'+r,'s',rw.lic);xml=setCell(xml,'L'+r,'s',rw.name);
      for(let d=1;d<=days;d++){const h=rw.hours[d]||0;if(h>0)xml=setCell(xml,colLetter(15+d)+r,'n',h);}});
    xml=rebuildLicValidation(xml,rows); // 資格ドロップダウンを各行の職種に直結
    return xml;
  }
  // 新シート追加（公式（１枚版）をバイト同一で複製＝プルダウン・印刷設定も保持、値セルのみ差し替え済み）
  let seq=200;
  function addSheet(name,xml){
    const file='worksheets/sheet'+seq+'.xml';
    zip.file('xl/'+file,xml);
    // マスターの_rels（印刷設定への参照）を同じ内容で複製＝pageSetupのr:idが有効になりExcel修復不要
    if(masterRels) zip.file('xl/worksheets/_rels/sheet'+seq+'.xml.rels',masterRels);
    const rid='rId'+seq;
    relsxml=relsxml.replace('</Relationships>','<Relationship Id="'+rid+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="'+file+'"/></Relationships>');
    wbxml=wbxml.replace('</sheets>','<sheet name="'+xmlEsc(name)+'" sheetId="'+seq+'" r:id="'+rid+'"/></sheets>');
    ctxml=ctxml.replace('</Types>','<Override PartName="/xl/'+file+'" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>');
    seq++;
  }

  // 月ごとに「（１枚版）勤務形態一覧表」シートを作成し末尾に追加（古い順）
  monthKeys.forEach(k=>{
    const mm=k.match(/^sch:(\d{4})-(\d{2})$/);
    const y=+mm[1], m=+mm[2]-1;
    const schData=S.schedules[k]; if(!schData) return;
    const days=dim(y,m);
    const era=y-2018;
    addSheet(`令和${era}年${m+1}月`, fillHours(hoursMaster,schData,days,y,m));
  });

  // 開いたとき自動で再計算（常勤換算の合計を即反映）
  if(/<calcPr[^>]*\/>/.test(wbxml)) wbxml=wbxml.replace(/<calcPr[^>]*\/>/,'<calcPr calcId="191028" fullCalcOnLoad="1"/>');
  else wbxml=wbxml.replace('</workbook>','<calcPr calcId="191028" fullCalcOnLoad="1"/></workbook>');

  zip.file('xl/workbook.xml',wbxml);
  zip.file('xl/_rels/workbook.xml.rels',relsxml);
  zip.file('[Content_Types].xml',ctxml);
  const blob=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`勤務形態一覧表_${typeName}.xlsx`;a.click();URL.revokeObjectURL(url);
  showFlash(`${typeName}のExcel（${monthKeys.length}か月分）をダウンロードしました ✓`+(overflow?' ※人数が多く一部の行が収まりませんでした':''),'gb');
}

function printPDF(){
  const y=S.aYr,m=S.aMo,schData=S.schedules[sk(y,m)];
  if(!schData){showFlash('勤務表がありません','ab');return;}
  const days=dim(y,m);
  const wl=['日','月','火','水','木','金','土'];
  const shBg=sh=>isCaseShift(sh)?'#E8DEF8':({'日勤':'#E6F1FB','A勤':'#C8E6FA','P勤':'#B3D4F7','研修':'#FCE3B4','夜勤':'#3C3489','夜勤明け':'#EF9F27','有給':'#EAF3DE','休み':'#F0F0F0','バースデー':'#FFD700','リフレッシュ':'#87CEEB','空白':'#fff'}[sh]||'#fff');
  const shFg=sh=>isCaseShift(sh)?'#4527A0':({'夜勤':'#EEEDFE','夜勤明け':'#2d1c00','日勤':'#0C447C','A勤':'#0C447C','P勤':'#0C447C','研修':'#8A5A00','有給':'#27500A','休み':'#888','バースデー':'#000','リフレッシュ':'#FFEB3B'}[sh]||'#333');
  const shLbl=sh=>isCaseShift(sh)?caseNum(sh)+'件':({'日勤':'日','A勤':'A','P勤':'P','研修':'研','夜勤':'夜','夜勤明け':'明','休み':'休','有給':'有','バースデー':'バ','リフレッシュ':'リ','空白':''}[sh]||'');

  function counts(sid){
    let ko=0,yu=0,ni=0,ya=0,ak=0;
    for(let d=1;d<=days;d++){
      const sh=(schData[sid]||{})[d]||'';
      if(sh==='休み')ko++;else if(sh==='有給')yu++;else if(sh==='日勤'||sh==='A勤'||sh==='P勤'||sh==='研修')ni++;
      else if(sh==='夜勤')ya++;else if(sh==='夜勤明け')ak++;
    }
    return{ko,yu,ni,ya,ak};
  }

  const viols=(schData['_violations']||{});
  const dayArr=Array.from({length:days},(_,i)=>dayStaffCount(schData,i+1));

  const headers=Array.from({length:days},(_,i)=>{
    const d=i+1,w=dow(y,m,d),hol=isHoliday(y,m,d);

    const fc=w===6||w===0||hol?'#fff':'#333';
    return `<th style="border:0.5px solid #bbb;width:18px;font-size:7px;padding:1px;text-align:center;background:${bg};color:${fc};-webkit-print-color-adjust:exact;print-color-adjust:exact">${d}<br>${wl[w]}</th>`;
  }).join('');

  const countH=`<th style="border:0.5px solid #bbb;font-size:7px;padding:1px;text-align:center;background:#ddd;width:14px">休</th><th style="border:0.5px solid #bbb;font-size:7px;padding:1px;text-align:center;background:#ddd;width:14px">有</th><th style="border:0.5px solid #bbb;font-size:7px;padding:1px;text-align:center;background:#ddd;width:14px">日</th><th style="border:0.5px solid #bbb;font-size:7px;padding:1px;text-align:center;background:#ddd;width:14px">夜</th><th style="border:0.5px solid #bbb;font-size:7px;padding:1px;text-align:center;background:#ddd;width:14px">明</th>`;

  let prevType='';
  const rows=S.staffList.map(s=>{
    const tcol=s.type==='nurse'?'#185FA5':isCareType(s.type)?'#3B6D11':'#854F0B';
    const ct=counts(s.id);
    let spacer='';
    if(prevType&&typeGrp(prevType)==='nurse'&&typeGrp(s.type)==='care'){
      spacer=`<tr><td colspan="${days+6}" style="height:3px;border:none;background:#f5f5f5"></td></tr>`;

      const isHiKyu=_reqsHi.includes(d)&&_rtHi[d]!=='nenkyuu';
      const showKi=isHiKyu&&sh==='休み'&&!isV;
      const colBg=w===6?'rgba(24,95,165,.1)':(w===0||hol)?'rgba(163,45,45,.1)':'';
      const bg=isV?'#FFD6E0':(showKi?'#FFE680':(sh?shBg(sh):colBg||'#fff'));
      const fg=showKi?'#000':shFg(sh);
      const lbl=showKi?'希休':shLbl(sh);
      const fsz=showKi?'6px':'7px';
      return `<td style="border:0.5px solid #bbb;width:18px;height:16px;text-align:center;font-size:${fsz};background:${bg};color:${fg};font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact">${lbl}</td>`;
    }).join('');
    return spacer+`<tr>
      <td style="border:0.5px solid #bbb;padding:1px 3px;font-size:8px;white-space:nowrap;border-left:3px solid ${s.employment==='part'?'#9C27B0':tcol};${s.employment==='part'?'background:#F5EAFB;':''}min-width:65px;-webkit-print-color-adjust:exact;print-color-adjust:exact">${s.name}${s.workHours?'<br><span style="font-size:6px;color:#7B1FA2;font-weight:600">🕒'+s.workHours+'</span>':''}</td>
      ${cells}

    </tr>`;
  }).join('');

  const nurseArrP=Array.from({length:days},(_,i)=>dayCountByGroup(schData,i+1,'nurse'));
  const careArrP =Array.from({length:days},(_,i)=>dayCountByGroup(schData,i+1,'care'));
  const totalArrP=nurseArrP.map((n,i)=>n+careArrP[i]);
  const pdfCntRow=(label,arr,useMin,labelColor)=>`<tr>
    <td style="border:0.5px solid #bbb;padding:1px 3px;font-size:8px;background:#e8e8e8;font-weight:700${labelColor?';color:'+labelColor:''}">${label}</td>

      return `<td style="border:0.5px solid #bbb;text-align:center;font-size:8px;background:${bg};font-weight:700;color:${color};-webkit-print-color-adjust:exact;print-color-adjust:exact">${cnt}</td>`;
    }).join('')}
    <td colspan="5" style="border:0.5px solid #bbb;background:#e8e8e8"></td>
  </tr>`;
  const dayCntRow=pdfCntRow('看護',nurseArrP,false,'#185FA5')
    +pdfCntRow('介護職員（訪問介護員）',careArrP,false,'#3B6D11')
    +pdfCntRow('合計（必要数）',totalArrP,true,'');

  const win=window.open('','_blank');
  win.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">

    @page{size:A4 landscape;margin:8mm}

  </head><body>

    <div class="leg"><div class="lb" style="background:#B3D4F7"></div>P=P勤</div>
    <div class="leg"><div class="lb" style="background:#3C3489"></div>夜=夜勤</div>

    <div class="leg"><div class="lb" style="background:#EAF3DE;border-color:#3B6D11"></div>有=有給</div>
    <div class="leg"><div class="lb" style="background:#F0F0F0"></div>休=休み</div>
    <div class="leg"><div class="lb" style="background:#FFE680"></div>希休=希望休</div>
    <div class="leg"><div class="lb" style="background:#FFD700"></div>バ=バースデー休暇</div>
    <div class="leg"><div class="lb" style="background:#87CEEB"></div>リ=リフレッシュ休暇</div>
    <div class="leg"><span style="color:#9C27B0;font-weight:700">▌</span><span style="background:#F5EAFB;padding:0 3px">パート</span>(勤務時間は名前下に記載)</div>
    <div class="leg"><span style="color:#185FA5;font-weight:700">▌</span>看護師</div>
    <div class="leg"><span style="color:#3B6D11;font-weight:700">▌</span>介護士</div>
    <div class="leg"><span style="color:#854F0B;font-weight:700">▌</span>バイト</div>
  </div>
  <table>
    <thead><tr>
      <th style="border:0.5px solid #bbb;min-width:65px;font-size:8px;padding:2px 3px;background:#e0e0e0;text-align:left">スタッフ</th>
      ${headers}${countH}
    </tr></thead>
    <tbody>${rows}${dayCntRow}</tbody>
  </table>
  </body></html>`);
  win.document.close();
  setTimeout(()=>win.print(),500);
}

document.addEventListener('DOMContentLoaded', function(){ loadAll(); });
</script>
